version: '3.8'

# ==============================================================================
# AEGISLEDGER - DOCKER COMPOSE LOCAL DEVELOPMENT ENVIRONMENT
# Provides persistent infrastructure (Postgres, Redis, Kafka) for local IDE runs
# ==============================================================================

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: aegis-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-aegis_ledger}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aegis_ledger}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis-dev-network

  redis-dev:
    image: redis:7-alpine
    container_name: aegis-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis-dev-network

  kafka-dev:
    image: apache/kafka:3.7.0
    container_name: aegis-kafka-dev
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-dev:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - aegis-dev-network

volumes:
  postgres_dev_data:

networks:
  aegis-dev-network:
    name: aegis-dev-network
    driver: bridge
