name: AegisLedger CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Unit & Concurrency Tests
        run: ./mvnw clean test -B

      - name: Package Executable Artifact
        run: ./mvnw package -DskipTests -B

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ledger-jar
          path: target/aegis-ledger-*.jar
          retention-days: 7

  docker-lint:
    name: Dockerfile Lint & Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Syntax
        run: docker compose -f docker/docker-compose.yml config

      - name: Validate Dev Docker Compose Syntax
        run: docker compose -f docker/docker-compose.dev.yml config
