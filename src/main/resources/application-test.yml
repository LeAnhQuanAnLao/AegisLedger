spring:
  application:
    name: aegis-ledger-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:aegis_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false
  flyway:
    enabled: false

server:
  port: -1

aegis:
  fraud:
    velocity-window-seconds: 60
    max-transactions-per-window: 5
    large-amount-threshold: 100000.00
  outbox:
    worker-fixed-rate-ms: 500
